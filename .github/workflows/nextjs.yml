name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # This opts you into Node 24 now to clear those warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4 is fine, but you can use v4.1.1+

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # Upgraded to v4 for Node 24 support
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Move to 24 now to be ahead of the curve
          cache: 'pnpm'
          # This line tells the action WHERE your lockfile is
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # --frozen-lockfile is best for CI to ensure exact versions
        run: pnpm install --frozen-lockfile

      - name: Build with Next.js
        run: pnpm next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
